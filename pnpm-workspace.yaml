packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions across the workspace.
# Reference with the `catalog:` protocol (e.g. "eslint": "catalog:") so every
# package — including the client/shared packages as they migrate to TS — stays
# on one aligned version.
catalog:
  eslint: ^10.4.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-import: ^2.32.0
  eslint-plugin-simple-import-sort: ^12.1.1
  eslint-plugin-unicorn: 63.0.0
  eslint-plugin-unused-imports: ^4.4.1
  globals: ^17.6.0
  prettier: ^3.8.3
  typescript: ^5.9.3
  typescript-eslint: ^8.60.0

# pnpm 11's allowBuilds is the single source of truth for dependency build-script
# permission — it replaces the legacy onlyBuiltDependencies / ignoredBuiltDependencies,
# which previously listed sharp in BOTH allow and ignore. sharp is allowed: its install
# script just verifies the prebuilt @img/sharp-* binary (no source build).
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  eslint-plugin-react@7.37.5: patches/eslint-plugin-react@7.37.5.patch
