# Build the client and deploy it to GitHub Pages.
# Self-contained: builds here and uploads only the (required) Pages artifact —
# no intermediate build artifact is passed between workflows.
name: Deploy Build to Pages

on:
  push:
    branches: ['main']
    paths: ['apps/client/**', 'packages/**', 'pnpm-lock.yaml']
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch: {}

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; never cancel an in-progress production deploy.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    env:
      VITE_HOST: 'https://sandwicheck.app'
      VITE_API_SERVER: 'https://api.sandwicheck.app'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@sandwicheck/client..."

      - name: Build
        run: pnpm --filter @sandwicheck/client run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/client/build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
