server {
  listen 80;
  server_name localhost;
  
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
    
    # Set runtime variables
    sub_filter_once off;
    sub_filter '__VITE_HOST__' '$VITE_HOST';
    sub_filter '__VITE_API_SERVER__' '$VITE_API_SERVER';
    sub_filter '__VITE_ENV__' '$VITE_ENV';
  }
}