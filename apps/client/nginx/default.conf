server {
  # 8080: the nginx-unprivileged base image runs as a non-root user, which
  # cannot bind ports below 1024 outside of Docker's relaxed defaults.
  listen 8080;
  listen [::]:8080;
  server_name localhost;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
}
